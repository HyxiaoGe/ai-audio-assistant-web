name: AI Audio Web Build & Deploy

on:
  push:
    branches: [master]
    # 纯文档改动跳过整条 build+deploy(仅这些文件时不触发)。
    # 文档+代码混合的 push 仍照常部署;需强制部署走下方 workflow_dispatch。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.env.example'
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: 要部署的已知不可变镜像提交 SHA（40 位小写十六进制，由操作方确认目标）
        required: false
        type: string
      rollback_reason:
        description: 手动回滚原因；设置 rollback_sha 时必填
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ai-audio-web-build-deploy-${{ github.ref }}
  cancel-in-progress: false

# 镜像源:阿里云 ACR 个人版(深圳),替代原 ghcr.io。
# 动机:Windows 构建机与 dev 部署机同处国内,镜像却经 ghcr(海外 Fastly)跨境往返一圈,
# 1.49GB 大镜像在 GFW 链路上 pull 反复被 reset(部署反复栽在 Login/Pull GHCR)。改走境内 ACR 去掉跨境跳。
env:
  REGISTRY: crpi-77w10wlykpqilmmb.cn-shenzhen.personal.cr.aliyuncs.com
  IMAGE_NAME: crpi-77w10wlykpqilmmb.cn-shenzhen.personal.cr.aliyuncs.com/seanfield/ai-audio-assistant-web
  DEPLOY_TARGET_SHA: ${{ github.event.inputs.rollback_sha || github.sha }}

jobs:
  publish:
    name: Publish master image on Windows runner
    if: ${{ github.ref == 'refs/heads/master' && (github.event_name != 'workflow_dispatch' || github.event.inputs.rollback_sha == '') }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    environment:
      name: dev
      deployment: false
    outputs:
      started_at: ${{ steps.pipeline_start.outputs.started_at }}
      runner_name: ${{ steps.pipeline_start.outputs.runner_name }}
    defaults:
      run:
        shell: cmd

    steps:
      - name: Record pipeline start
        id: pipeline_start
        run: |
          for /f %%i in ('powershell -NoProfile -ExecutionPolicy Bypass -Command "[DateTimeOffset]::UtcNow.ToUnixTimeSeconds()"') do echo started_at=%%i>>%GITHUB_OUTPUT%
          echo runner_name=${{ runner.name }}>>%GITHUB_OUTPUT%

      - name: Isolate Docker credentials
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $dockerConfig = Join-Path $env:RUNNER_TEMP ".docker-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"
          if (Test-Path -LiteralPath $dockerConfig) {
            Remove-Item -LiteralPath $dockerConfig -Recurse -Force
          }
          New-Item -ItemType Directory -Path $dockerConfig | Out-Null
          "DOCKER_CONFIG=$dockerConfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Push CI/CD active metric
        if: github.ref == 'refs/heads/master'
        continue-on-error: true
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          PUSHGW_AUTH: ${{ secrets.PUSHGW_BASIC_AUTH }}
        run: |
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $metrics = @"
          # HELP cicd_pipeline_active Whether a CI/CD pipeline is currently active (1=true, 0=false).
          # TYPE cicd_pipeline_active gauge
          cicd_pipeline_active{project="ai-audio-assistant-web",branch="$env:GITHUB_REF_NAME",environment="dev",runner="${{ runner.name }}"} 1
          # HELP cicd_pipeline_active_timestamp_seconds Timestamp of the latest CI/CD active-state update.
          # TYPE cicd_pipeline_active_timestamp_seconds gauge
          cicd_pipeline_active_timestamp_seconds{project="ai-audio-assistant-web",branch="$env:GITHUB_REF_NAME",environment="dev",runner="${{ runner.name }}"} $now
          "@
          $body = (($metrics -replace "`r`n", "`n").Trim() + "`n")
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($body)
          # pushgateway 本体只绑 loopback，经 nginx 9094 鉴权反代推送（凭证在 dev Environment Secret PUSHGW_BASIC_AUTH）
          Invoke-WebRequest -UseBasicParsing -Method Post -Uri "http://192.168.1.11:9094/metrics/job/cicd_active/project_key/ai-audio-assistant-web/branch_key/master/environment_key/dev" -ContentType "text/plain; version=0.0.4" -Headers @{ Authorization = "Basic $env:PUSHGW_AUTH" } -Body $bytes -TimeoutSec 5

      - name: Checkout
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.rollback_sha == ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify Docker access
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.rollback_sha == ''
        run: |
          docker version
          docker ps

      - name: Build Docker image
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.rollback_sha == ''
        run: |
          docker build --build-arg GIT_SHA=%GITHUB_SHA% -t "%IMAGE_NAME%:%GITHUB_SHA%" .

      - name: Lint in image
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.rollback_sha == ''
        run: |
          docker run --rm "%IMAGE_NAME%:%GITHUB_SHA%" sh -lc "pip install --no-cache-dir ruff && ruff check app/ worker/ tests/"

      - name: Run tests
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.rollback_sha == ''
        timeout-minutes: 8
        run: |
          docker run --rm "%IMAGE_NAME%:%GITHUB_SHA%" sh -lc "pip install --no-cache-dir pytest pytest-asyncio pytest-mock pytest-cov aiosqlite && pytest tests/ -v"

      - name: Login to ACR
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.rollback_sha == ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
          logout: false

      - name: Push Docker image
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.rollback_sha == ''
        run: docker push "%IMAGE_NAME%:%GITHUB_SHA%"

      - name: Cleanup local Docker artifacts
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.rollback_sha == '') }}
        run: |
          docker image rm "%IMAGE_NAME%:%GITHUB_SHA%" 2>NUL
          docker builder prune --filter "until=72h" -f

      - name: Cleanup Docker credentials
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $expected = [System.IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP ".docker-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"))
          $runnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
          if ([string]::IsNullOrWhiteSpace($env:DOCKER_CONFIG) -or [System.IO.Path]::GetFullPath($env:DOCKER_CONFIG) -ne $expected) {
            throw "拒绝清理非本 job 的 DOCKER_CONFIG: $env:DOCKER_CONFIG"
          }
          $configPath = [System.IO.Path]::GetFullPath($env:DOCKER_CONFIG)
          if (-not $configPath.StartsWith($runnerTemp + [System.IO.Path]::DirectorySeparatorChar)) {
            throw "DOCKER_CONFIG 不在 RUNNER_TEMP 下: $configPath"
          }
          if (Test-Path -LiteralPath $configPath) {
            Remove-Item -LiteralPath $configPath -Recurse -Force
          }

  deploy:
    name: Deploy master on dev server
    needs: publish
    if: ${{ always() && github.ref == 'refs/heads/master' && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_sha != '')) }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    environment: dev
    outputs:
      started_at: ${{ steps.deploy_start.outputs.started_at }}

    steps:
      - name: Record deploy start time
        id: deploy_start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Resolve deployment target
        id: release_target
        env:
          ROLLBACK_SHA: ${{ github.event.inputs.rollback_sha }}
          ROLLBACK_REASON: ${{ github.event.inputs.rollback_reason }}
        run: |
          set -euo pipefail
          if [[ ! "${DEPLOY_TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "deployment target must be a 40-character lowercase commit SHA"
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${ROLLBACK_SHA}" ]; then
            if [[ ! "${ROLLBACK_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "rollback target must be a 40-character lowercase commit SHA"
              exit 1
            fi
            if [ -z "${ROLLBACK_REASON//[[:space:]]/}" ]; then
              echo "rollback reason is required"
              exit 1
            fi
            printf '手动回滚目标已验证：%s\n' "${ROLLBACK_SHA}"
            printf '手动回滚原因：%s\n' "${ROLLBACK_REASON}"
          elif [ -n "${ROLLBACK_REASON//[[:space:]]/}" ]; then
            echo "rollback reason requires rollback_sha"
            exit 1
          fi

      - name: Isolate Docker credentials
        run: |
          docker_config="${RUNNER_TEMP}/.docker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          if [ -e "$docker_config" ]; then
            echo "DOCKER_CONFIG 路径已存在,拒绝复用: $docker_config"
            exit 1
          fi
          mkdir -p "$docker_config"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"

      - name: Login to ACR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
          logout: false

      - name: Capture rollback state
        id: capture_rollback_state
        run: |
          set -euo pipefail
          capture_container() {
            local container="$1"
            local prefix="$2"
            local image image_id image_sha
            image="$(docker inspect --format '{{.Config.Image}}' "${container}")"
            image_id="$(docker inspect --format '{{.Image}}' "${container}")"
            image_sha="${image#${IMAGE_NAME}:}"
            if [ "${image_sha}" = "${image}" ] || [[ ! "${image_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "${container} 没有不可变 SHA 回滚镜像：${image}"
              exit 1
            fi
            if [[ ! "${image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "${container} 的镜像内容 ID 无效：${image_id}"
              exit 1
            fi
            {
              echo "${prefix}_image=${image}"
              echo "${prefix}_image_id=${image_id}"
            } >> "$GITHUB_OUTPUT"
          }

          capture_container ai-audio-assistant-web-api api
          capture_container ai-audio-assistant-web-worker worker
          capture_container ai-audio-assistant-web-beat beat

          api_image="$(docker inspect --format '{{.Config.Image}}' ai-audio-assistant-web-api)"
          worker_image="$(docker inspect --format '{{.Config.Image}}' ai-audio-assistant-web-worker)"
          beat_image="$(docker inspect --format '{{.Config.Image}}' ai-audio-assistant-web-beat)"
          api_image_id="$(docker inspect --format '{{.Image}}' ai-audio-assistant-web-api)"
          worker_image_id="$(docker inspect --format '{{.Image}}' ai-audio-assistant-web-worker)"
          beat_image_id="$(docker inspect --format '{{.Image}}' ai-audio-assistant-web-beat)"
          if [ "${api_image}" != "${worker_image}" ] || [ "${api_image}" != "${beat_image}" ]; then
            echo "api/worker/beat 当前镜像引用不一致，拒绝生成不完整回滚点"
            exit 1
          fi
          if [ "${api_image_id}" != "${worker_image_id}" ] || [ "${api_image_id}" != "${beat_image_id}" ]; then
            echo "api/worker/beat 当前镜像内容 ID 不一致，拒绝生成不完整回滚点"
            exit 1
          fi

      - name: Apply alembic migrations
        id: release_migration
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.rollback_sha == ''
        run: |
          cd ~/project/ai-audio-assistant-web
          docker pull ${{ env.IMAGE_NAME }}:${{ env.DEPLOY_TARGET_SHA }}
          # 数据库迁移采用 expand/contract；镜像回滚不执行 alembic downgrade，旧镜像必须兼容新 schema。
          # 用 docker --env-file 让 docker 自己解析 .env，而不是 bash source。
          # bash source 会把 YOUTUBE_OUTPUT_TEMPLATE=%(id)s.%(ext)s 这类含 ( 的值当 subshell 启动失败。
          docker run --rm \
            --network ai-audio-network \
            --env-file .env \
            ${{ env.IMAGE_NAME }}:${{ env.DEPLOY_TARGET_SHA }} \
            alembic upgrade head

      - name: Pull and restart api/worker/beat
        id: deploy_candidate
        run: |
          cd ~/project/ai-audio-assistant-web
          docker pull ${{ env.IMAGE_NAME }}:${{ env.DEPLOY_TARGET_SHA }}
          cat > docker-compose.ai-audio-web-ghcr.yml <<'EOF'
          x-common: &common
            image: ${{ env.IMAGE_NAME }}:${{ env.DEPLOY_TARGET_SHA }}
            env_file: .env
            environment:
              TZ: UTC
              # 与前端 NEXT_PUBLIC_AUTH_CLIENT_ID 对应；缺失时 Compose 在替换阶段直接失败，
              # 不能让 auth-client 退化为不校验 audience。
              AUTH_SERVICE_CLIENT_ID: ${AUTH_SERVICE_CLIENT_ID:?AUTH_SERVICE_CLIENT_ID must be set}
              # LiteLLM 全模型 /health 探测默认关闭（每模型真实 completion 产生费用）。
              # 开启：GitHub Actions secrets/vars 设 LITELLM_HEALTH_ENABLED=true（此值优先于 env_file）。
              LITELLM_HEALTH_ENABLED: ${LITELLM_HEALTH_ENABLED:-false}
            restart: unless-stopped
            volumes:
              - ./data:/app/data
            networks:
              - ai-audio-network

          services:
            api:
              <<: *common
              container_name: ai-audio-assistant-web-api
              # 2 个 uvicorn worker 利用多核(单进程仅吃 1 核;压测基线 /health ~450RPS 即单核饱和、7 核闲置)。
              # 约束:每 worker 自带一套 DB 连接池(DB_POOL_SIZE+MAX_OVERFLOW),worker 翻倍即把池减半,
              # 让 api 对共享 Postgres 的连接上限持平 2×(5+10)=30(=原单 worker 10+20),不挤占跨应用连接预算。
              command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
              environment:
                TZ: UTC
                DB_POOL_SIZE: "5"
                DB_MAX_OVERFLOW: "10"
              # 2 worker × ~175MiB + 余量;主机可用 ~6.1GiB 足以吸收(原 384m 仅够单 worker)。
              mem_limit: 768m

            worker:
              <<: *common
              container_name: ai-audio-assistant-web-worker
              command: celery -A worker.celery_app worker --loglevel=info --autoscale=8,1
              mem_limit: 1g

            beat:
              <<: *common
              container_name: ai-audio-assistant-web-beat
              command: celery -A worker.celery_app beat --loglevel=info
              mem_limit: 192m

          networks:
            ai-audio-network:
              external: true
          EOF
          # 先完成变量替换与 Compose 语法校验，再移除旧容器；缺 client_id 时保留当前服务在线。
          docker compose -f docker-compose.ai-audio-web-ghcr.yml config --quiet
          # 兜底：清掉旧 compose project 持有的容器，避免首次切换 GHCR 时容器名冲突
          docker rm -f ai-audio-assistant-web-api-1 ai-audio-assistant-web-worker-1 ai-audio-assistant-web-beat-1 2>/dev/null || true
          docker rm -f ai-audio-assistant-web-api ai-audio-assistant-web-worker ai-audio-assistant-web-beat 2>/dev/null || true
          docker compose -f docker-compose.ai-audio-web-ghcr.yml up -d

      - name: Verify readiness
        id: release_verify
        run: |
          # 探 /readiness(Postgres/Redis/Celery 全活才 200 "ready";任一挂 → 503)。
          # 先证明容器运行的正是本次 SHA 镜像,再从容器网络命名空间内探测 8000。
          expected_image="${{ env.IMAGE_NAME }}:${{ env.DEPLOY_TARGET_SHA }}"
          expected_image_id="$(docker image inspect --format '{{.Id}}' "$expected_image")"
          for container in ai-audio-assistant-web-api ai-audio-assistant-web-worker ai-audio-assistant-web-beat; do
            actual_image="$(docker inspect --format '{{.Config.Image}}' "${container}")"
            actual_image_id="$(docker inspect --format '{{.Image}}' "${container}")"
            if [ "${actual_image}" != "${expected_image}" ] || [ "${actual_image_id}" != "${expected_image_id}" ]; then
              echo "${container} 镜像身份不一致: expected=${expected_image}/${expected_image_id} actual=${actual_image}/${actual_image_id}"
              exit 1
            fi
          done

          for attempt in $(seq 1 30); do
            if docker exec ai-audio-assistant-web-api python -c \
              'import json, urllib.request; payload = json.load(urllib.request.urlopen("http://127.0.0.1:8000/api/v1/readiness", timeout=5)); raise SystemExit(0 if payload.get("status") == "ready" else 1)'; then
              exit 0
            fi
            sleep 2
          done

          echo "readiness 未就绪,最后一次响应:"
          docker exec ai-audio-assistant-web-api python -c \
            'import urllib.request; print(urllib.request.urlopen("http://127.0.0.1:8000/api/v1/readiness", timeout=5).read().decode())' || true
          docker logs --tail=120 ai-audio-assistant-web-api || true
          exit 1

      - name: Rollback failed candidate
        id: rollback_candidate
        if: ${{ failure() && steps.capture_rollback_state.outcome == 'success' && steps.deploy_candidate.outcome != 'skipped' }}
        env:
          PREVIOUS_API_IMAGE: ${{ steps.capture_rollback_state.outputs.api_image }}
          PREVIOUS_API_IMAGE_ID: ${{ steps.capture_rollback_state.outputs.api_image_id }}
          PREVIOUS_WORKER_IMAGE: ${{ steps.capture_rollback_state.outputs.worker_image }}
          PREVIOUS_WORKER_IMAGE_ID: ${{ steps.capture_rollback_state.outputs.worker_image_id }}
          PREVIOUS_BEAT_IMAGE: ${{ steps.capture_rollback_state.outputs.beat_image }}
          PREVIOUS_BEAT_IMAGE_ID: ${{ steps.capture_rollback_state.outputs.beat_image_id }}
        run: |
          set -euo pipefail
          cd ~/project/ai-audio-assistant-web
          for image_id in "${PREVIOUS_API_IMAGE_ID}" "${PREVIOUS_WORKER_IMAGE_ID}" "${PREVIOUS_BEAT_IMAGE_ID}"; do
            docker image inspect "${image_id}" >/dev/null
          done

          image_line_count="$(grep -c '^    image: ' docker-compose.ai-audio-web-ghcr.yml || true)"
          if [ "${image_line_count}" != "1" ]; then
            echo "回滚 Compose 必须恰好包含一个公共 image 行，实际 ${image_line_count}"
            exit 1
          fi
          escaped_previous_image="$(printf '%s' "${PREVIOUS_API_IMAGE}" | sed 's/[&|]/\\&/g')"
          sed -i "s|^    image: .*|    image: ${escaped_previous_image}|" docker-compose.ai-audio-web-ghcr.yml
          docker compose -f docker-compose.ai-audio-web-ghcr.yml config --quiet
          docker compose -f docker-compose.ai-audio-web-ghcr.yml up -d

          verify_rollback_container() {
            local container="$1"
            local expected_image="$2"
            local expected_image_id="$3"
            local actual_image actual_image_id
            actual_image="$(docker inspect --format '{{.Config.Image}}' "${container}")"
            actual_image_id="$(docker inspect --format '{{.Image}}' "${container}")"
            if [ "${actual_image}" != "${expected_image}" ] || [ "${actual_image_id}" != "${expected_image_id}" ]; then
              echo "${container} 回滚身份不一致: expected=${expected_image}/${expected_image_id} actual=${actual_image}/${actual_image_id}"
              exit 1
            fi
          }
          verify_rollback_container ai-audio-assistant-web-api "${PREVIOUS_API_IMAGE}" "${PREVIOUS_API_IMAGE_ID}"
          verify_rollback_container ai-audio-assistant-web-worker "${PREVIOUS_WORKER_IMAGE}" "${PREVIOUS_WORKER_IMAGE_ID}"
          verify_rollback_container ai-audio-assistant-web-beat "${PREVIOUS_BEAT_IMAGE}" "${PREVIOUS_BEAT_IMAGE_ID}"

          rollback_ready=0
          for attempt in $(seq 1 30); do
            if docker exec ai-audio-assistant-web-api python -c \
              'import json, urllib.request; payload = json.load(urllib.request.urlopen("http://127.0.0.1:8000/api/v1/readiness", timeout=5)); raise SystemExit(0 if payload.get("status") == "ready" else 1)'; then
              rollback_ready=1
              break
            fi
            sleep 2
          done
          if [ "${rollback_ready}" != "1" ]; then
            echo "回滚后 readiness 未就绪"
            docker logs --tail=120 ai-audio-assistant-web-api || true
            exit 1
          fi
          echo "已恢复上一健康镜像并通过容器内 readiness"

      - name: Cleanup old images
        id: release_cleanup
        if: success()
        run: |
          current="${{ env.IMAGE_NAME }}:${{ env.DEPLOY_TARGET_SHA }}"
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' ${{ env.IMAGE_NAME }} \
            | awk -v current="$current" '$1 != current {print $2}' \
            | sort -u \
            | xargs -r docker rmi || true

      - name: Cleanup Docker credentials
        if: always()
        run: |
          expected="${RUNNER_TEMP}/.docker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          if [ -z "${DOCKER_CONFIG:-}" ] || [ "$DOCKER_CONFIG" != "$expected" ]; then
            echo "拒绝清理非本 job 的 DOCKER_CONFIG: ${DOCKER_CONFIG:-<empty>}"
            exit 1
          fi
          case "$DOCKER_CONFIG" in
            "$RUNNER_TEMP"/.docker-"$GITHUB_RUN_ID"-"$GITHUB_RUN_ATTEMPT"-"$GITHUB_JOB") ;;
            *)
              echo "DOCKER_CONFIG 不在 RUNNER_TEMP 的 job 隔离路径下: $DOCKER_CONFIG"
              exit 1
              ;;
          esac
          rm -rf -- "$DOCKER_CONFIG"

  finalize:
    name: Finalize master release
    needs: [publish, deploy]
    if: ${{ always() && github.ref == 'refs/heads/master' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    environment:
      name: dev
      deployment: false

    steps:
      - name: Resolve final release status
        id: final_status
        env:
          PUBLISH_RESULT: ${{ needs.publish.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PUBLISH_STARTED_AT: ${{ needs.publish.outputs.started_at }}
          DEPLOY_STARTED_AT: ${{ needs.deploy.outputs.started_at }}
          PUBLISH_RUNNER_NAME: ${{ needs.publish.outputs.runner_name }}
          ROLLBACK_SHA: ${{ github.event.inputs.rollback_sha }}
        run: |
          if [ "$DEPLOY_RESULT" = "success" ] && (
            [ "$PUBLISH_RESULT" = "success" ] ||
            { [ "$PUBLISH_RESULT" = "skipped" ] && [ -n "$ROLLBACK_SHA" ]; }
          ); then
            final_status=success
          else
            final_status=failure
          fi

          pipeline_started_at="${PUBLISH_STARTED_AT:-$(date +%s)}"
          deploy_started_at="${DEPLOY_STARTED_AT:-$pipeline_started_at}"
          runner_name="${PUBLISH_RUNNER_NAME:-unknown}"
          {
            echo "status=$final_status"
            echo "pipeline_started_at=$pipeline_started_at"
            echo "deploy_started_at=$deploy_started_at"
            echo "runner_name=$runner_name"
          } >> "$GITHUB_OUTPUT"
          echo "发布最终状态: publish=$PUBLISH_RESULT deploy=$DEPLOY_RESULT final=$final_status"

      - name: Push CI/CD metrics
        id: release_metrics
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: |
          bash ~/scripts/push-cicd-metrics.sh \
            ai-audio-assistant-web \
            "${{ github.ref_name }}" \
            dev \
            "${{ steps.final_status.outputs.status }}" \
            "${{ steps.final_status.outputs.pipeline_started_at }}" \
            "${{ env.IMAGE_NAME }}:${{ env.DEPLOY_TARGET_SHA }}" \
            "${{ env.DEPLOY_TARGET_SHA }}" \
            "${{ steps.final_status.outputs.runner_name }}" \
            ai-audio-assistant-web \
            "${{ steps.final_status.outputs.deploy_started_at }}"

      - name: Fail unsuccessful release
        id: release_failure
        if: ${{ always() && steps.final_status.outputs.status != 'success' }}
        run: exit 1
